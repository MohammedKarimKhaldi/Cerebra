[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerebra"
version = "0.1.0"
description = "Cerebra Stage 1 Triage – AI brain MRI tumour detection POC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "monai[nibabel]>=1.3.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "nibabel>=5.2.0",
    "pydicom>=2.4.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
    "typer>=0.12.0",
    "matplotlib>=3.8.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.scripts]
cerebra-triage = "cerebra.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cerebra"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/cerebra --cov-report=term-missing --cov-report=html"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src/cerebra"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]
